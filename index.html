<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5eee8" />
    <meta name="description" content="一张安静、低饱和的个人记录工作台。" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>知秋</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MY QUIET DESK</p>
          <h1>知秋</h1>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="exportButton" aria-label="导出备份">↥ <span>备份</span></button>
          <button class="icon-button" id="installButton" aria-label="添加到手机桌面" hidden>
            <span class="install-glyph">⌂</span>
            <span>安装</span>
          </button>
          <label class="icon-button import-button" aria-label="导入备份">↧ <span>恢复</span><input id="importInput" type="file" accept="application/json" hidden /></label>
        </div>
      </header>

      <section class="welcome-card" aria-label="今日概览">
        <div>
          <p class="date-label" id="todayLabel"></p>
          <h2>慢一点，记下此刻。</h2>
          <p class="muted">把想法放在这里，留给未来的自己。</p>
        </div>
        <div class="orb" aria-hidden="true"></div>
      </section>

      <nav class="section-tabs" aria-label="记录板块">
        <button class="tab is-active" data-section="journal"><span>日记</span><small id="count-journal">0</small></button>
        <button class="tab" data-section="memo"><span>备忘</span><small id="count-memo">0</small></button>
        <button class="tab" data-section="quote"><span>摘录</span><small id="count-quote">0</small></button>
        <button class="tab" data-section="focus"><span>专注</span><small id="count-focus">0</small></button>
      </nav>

      <div class="journal-mode-tabs" id="journalModeTabs" aria-label="日记类型">
        <button class="journal-mode is-active" data-journal-type="standard"><span>日记</span><small id="count-journal-standard">0</small></button>
        <button class="journal-mode" data-journal-type="321"><span>321 日记</span><small id="count-journal-321">0</small></button>
      </div>
      <div class="quote-mode-tabs" id="quoteModeTabs" aria-label="摘录类型" hidden>
        <button class="quote-mode is-active" data-quote-type="copy"><span>文案</span><small id="count-quote-copy">0</small></button>
        <button class="quote-mode" data-quote-type="fact"><span>干货</span><small id="count-quote-fact">0</small></button>
      </div>

      <section class="focus-panel" id="focusPanel" hidden>
        <div class="focus-orbit"><div class="focus-time" id="focusTime">25:00</div><div class="focus-label" id="focusLabel">准备开始</div></div>
        <div class="focus-presets" aria-label="专注时长"><button class="focus-preset is-active" data-minutes="25">25 分钟</button><button class="focus-preset" data-minutes="50">50 分钟</button><button class="focus-preset" data-minutes="15">15 分钟</button></div>
        <div class="focus-actions"><button class="primary-button" id="focusStart">开始专注</button><button class="secondary-button" id="focusReset">重置</button></div>
        <p class="focus-note">把手机放远一点，只做眼前这一件事。</p>
      </section>

      <section class="content-area" id="contentArea">
        <div class="section-heading">
          <div>
            <p class="section-kicker" id="sectionKicker">JOURNAL</p>
            <h2 id="sectionTitle">日记</h2>
          </div>
          <div class="section-actions">
          <button class="secondary-button" id="monthlyBookButton" hidden>月度日记本</button>
            <button class="primary-button" id="newEntryButton"><span>＋</span> 新建</button>
          </div>
        </div>

        <div class="search-row" id="searchRow">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜索当前板块" autocomplete="off" />
          </label>
          <button class="filter-button" id="clearSearch" aria-label="清除搜索">清除</button>
        </div>

        <div id="entryList" class="entry-list" aria-live="polite"></div>
        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-mark">○</div>
          <h3>这里还很安静</h3>
          <p>写下第一条记录，让空间慢慢长出你的样子。</p>
          <button class="text-button" id="emptyCreateButton">开始记录 <span>↗</span></button>
        </div>
      </section>

      <footer class="footer-note">所有内容只保存在你的设备上 · 离线也可以使用</footer>
    </main>

    <div class="modal-backdrop" id="modalBackdrop" hidden></div>
    <section class="entry-modal" id="entryModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
      <div class="modal-grabber" aria-hidden="true"></div>
      <div class="modal-header">
        <div>
          <p class="section-kicker" id="modalKicker">JOURNAL</p>
          <h2 id="modalTitle">写一篇日记</h2>
        </div>
        <button class="close-button" id="closeModal" aria-label="关闭">×</button>
      </div>
      <form id="entryForm">
        <div id="titleField">
          <label class="field-label" id="titleLabel" for="entryTitle">标题 <span>可选</span></label>
          <input class="text-input" id="entryTitle" name="title" maxlength="80" placeholder="给这段记录一个名字" />
        </div>
        <div id="journalDateField" hidden>
          <label class="field-label" for="entryDate">日期</label>
          <input class="text-input" id="entryDate" name="entryDate" type="date" />
        </div>
        <div id="moodField" class="mood-field" hidden>
          <label class="field-label">今天的心情</label>
          <div class="mood-grid" id="moodGrid" role="radiogroup" aria-label="选择今天的心情"></div>
        </div>
        <div id="standardFields">
          <label class="field-label" id="bodyLabel" for="entryBody">内容</label>
          <textarea class="text-area" id="entryBody" name="body" required maxlength="2000" placeholder="写下此刻的想法……"></textarea>
        </div>
        <div id="threeTwoOneFields" class="three-two-one-fields" hidden>
          <div class="format-group">
            <div class="format-heading"><span class="format-number">3</span><div><strong>感恩的三件事</strong><small>记录当天让你感恩的三件事</small></div></div>
            <textarea class="text-area compact" name="gratitudeA" maxlength="500" placeholder="第一件感恩的事"></textarea>
            <textarea class="text-area compact" name="gratitudeB" maxlength="500" placeholder="第二件感恩的事"></textarea>
            <textarea class="text-area compact" name="gratitudeC" maxlength="500" placeholder="第三件感恩的事"></textarea>
          </div>
          <div class="format-group">
            <div class="format-heading"><span class="format-number">2</span><div><strong>让今天变好的两件事 / 感悟</strong><small>记录两件让当天变好的事，或两条感悟</small></div></div>
            <textarea class="text-area compact" name="betterA" maxlength="500" placeholder="第一件事 / 第一条感悟"></textarea>
            <textarea class="text-area compact" name="betterB" maxlength="500" placeholder="第二件事 / 第二条感悟"></textarea>
          </div>
          <div class="format-group">
            <div class="format-heading"><span class="format-number">1</span><div><strong>自我肯定</strong><small>写下一个自我肯定的句子</small></div></div>
            <textarea class="text-area compact" name="affirmation" maxlength="500" placeholder="我肯定自己……"></textarea>
          </div>
        </div>
        <div class="quote-fields" id="quoteFields" hidden>
          <label class="field-label">图片文字识别 <span>可选</span></label>
          <div class="quote-ocr-tools"><label class="quote-image-upload"><input id="quoteImage" type="file" accept="image/*" hidden /><span>上传图片</span></label><button type="button" class="secondary-button" id="ocrButton" disabled>识别图片文字</button><button type="button" class="text-button ocr-retry-button" id="ocrRetryButton" hidden>重新加载识别</button></div>
          <img class="quote-image-preview" id="quoteImagePreview" alt="摘录图片预览" hidden />
          <p class="ocr-status" id="ocrStatus" hidden></p>
          <div id="quoteSourceField">
            <label class="field-label" for="entryAuthor">来源 <span>可选</span></label>
            <input class="text-input" id="entryAuthor" name="author" maxlength="80" placeholder="作者或出处" />
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="secondary-button" id="cancelModal">取消</button>
          <button type="submit" class="primary-button">保存记录</button>
        </div>
      </form>
    </section>
    <section class="book-modal" id="bookModal" role="dialog" aria-modal="true" aria-labelledby="bookTitle" hidden>
      <div class="book-modal-header">
        <div>
          <p class="section-kicker">MONTHLY NOTEBOOK</p>
          <h2 id="bookTitle">月度日记本</h2>
        </div>
        <button class="close-button" id="closeBook" aria-label="关闭">×</button>
      </div>
      <div class="book-toolbar">
        <label class="month-picker"><span>选择月份</span><input type="month" id="bookMonth" /></label>
        <span class="book-page-count" id="bookPageCount"></span>
      </div>
      <div class="book-viewer" id="bookViewer"></div>
      <div class="book-controls">
        <button class="secondary-button" id="bookPrev">← 上一页</button>
        <button class="secondary-button" id="bookPrint">打印 / 导出 PDF</button>
        <button class="text-button" id="bookDownload">下载日记本网页</button>
        <button class="secondary-button" id="bookNext">下一页 →</button>
      </div>
      <div class="book-print-area" id="bookPrintArea" aria-hidden="true"></div>
    </section>
    <script src="app.js"></script>
  </body>
</html>
